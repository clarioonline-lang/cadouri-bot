name: Pagina vitrina

# Publica pagina cu ideile zilei pe GitHub Pages:
# https://clarioonline-lang.github.io/cadouri-bot/
on:
  workflow_run:
    workflows: ["Idei de cadouri zilnic"]
    types: [completed]
  workflow_dispatch:        # buton "Run workflow" pentru refacere manuala

permissions:
  contents: write   # pentru jurnalul postarilor pe Instagram
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genereaza pagina
        run: python pagina.py

      - name: Genereaza ghidurile (blog) cu preturi la zi + sitemap
        continue-on-error: true   # daca nu merge, pagina principala tot se publica
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_URL_2: ${{ secrets.FEED_URL_2 }}
        run: python ghiduri.py

      - name: Pune imaginile postarii pe vitrina (Instagram le ia de acolo)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python imagine_postare.py
          mkdir -p site/imagini
          cp imagini/*.jpg site/imagini/ 2>/dev/null || echo "Nicio imagine azi"

      - name: Pune Reel-ul pe vitrina (de descarcat de pe telefon, pentru Instagram)
        continue-on-error: true
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python reel.py
          mkdir -p site/imagini
          cp imagini/reel.mp4 site/imagini/ 2>/dev/null || echo "Niciun Reel azi"

      - name: Deseneaza caruselul TikTok (cadouripebuget.online/tiktok/)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python tiktok_carusel.py deseneaza

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        continue-on-error: true   # GitHub da uneori o eroare temporara la publicare
        uses: actions/deploy-pages@v4

      - name: Asteapta un minut inainte de reincercare
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Posteaza pe Instagram
        if: steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success'
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          sleep 20   # cateva secunde pana apar imaginile pe vitrina
          python post_instagram.py

      - name: Noteaza ca am postat pe Instagram
        if: always()
        run: |
          git config user.name "cadouri-bot"
          git config user.email "cadouri-bot@users.noreply.github.com"
          git checkout -- idei/facebook_post.json idei/reel.json idei/FACEBOOK.md 2>/dev/null || true
          git add idei/postat_ig.txt 2>/dev/null || true
          git commit -m "Postat pe Instagram $(date +%F)" || echo "Nimic nou"
          git pull --rebase --quiet || true
          git push || echo "Nu am putut salva jurnalul"
