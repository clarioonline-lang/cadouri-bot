name: Test imagine postare

# Deseneaza imaginea postarii din ideile de azi, FARA sa posteze si FARA sa salveze ceva.
# Imaginea se poate descarca de la "Artifacts", in pagina rularii.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deseneaza (fara postare)
        run: |
          pip install --quiet pillow
          python -c "from PIL import features; print('cifre drepte (raqm):', features.check('raqm'))"
          python facebook_post.py
          python imagine_postare.py
          python -c "from PIL import Image; import glob; [print(f, Image.open(f).size) for f in sorted(glob.glob('imagini/*.jpg'))]"

      - uses: actions/upload-artifact@v4
        with:
          name: imagine-test
          path: imagini/
          retention-days: 3
