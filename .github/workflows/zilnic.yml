name: Idei de cadouri zilnic

on:
  schedule:
    - cron: "5 3 * * *"    # 05:05 ora Romaniei iarna (06:05 vara); GitHub poate intarzia ~1 ora
  workflow_dispatch:        # buton "Run workflow" pentru rulare manuala

permissions:
  contents: write

jobs:
  idei:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genereaza ideile
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_URL_2: ${{ secrets.FEED_URL_2 }}
        run: python idei_cadouri.py

      - name: Genereaza postarea de Facebook
        run: python facebook_post.py

      - name: Deseneaza imaginea postarii (stilul paginii)
        continue-on-error: true   # daca nu merge, se posteaza poza originala a produsului
        run: |
          pip install --quiet pillow
          python imagine_postare.py

      - name: Fa Reel-ul zilei (clip vertical, 3 produse)
        continue-on-error: true   # daca nu merge, se posteaza poza, ca pana acum
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python reel.py

      - name: Verifica linkurile de afiliere (Profitshare + 2Performant)
        continue-on-error: true   # daca nu merge, restul ruleaza normal
        timeout-minutes: 20
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_URL_2: ${{ secrets.FEED_URL_2 }}
        run: python linkuri.py

      - name: Salveaza rezultatul in repo
        run: |
          git config user.name "cadouri-bot"
          git config user.email "cadouri-bot@users.noreply.github.com"
          git add -A idei istoric.txt 2>/dev/null || true
          git commit -m "Idei cadouri $(date +%F)" || echo "Nimic nou"
          git push

      - name: Posteaza Reel-ul pe Facebook
        continue-on-error: true   # daca nu merge, pasul urmator posteaza poza
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python post_reel_facebook.py

      - name: Posteaza pe Facebook (poza, doar daca Reel-ul nu a iesit)
        continue-on-error: true   # daca Facebook da eroare, ideile raman salvate
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python post_facebook.py

      - name: Noteaza ca am postat
        run: |
          git add idei/postat.txt 2>/dev/null || true
          git commit -m "Postat pe Facebook $(date +%F)" || echo "Nimic nou"
          git push
