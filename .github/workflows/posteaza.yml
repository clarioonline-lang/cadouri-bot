name: Posteaza pe Facebook (manual)

# Postarea zilnica se face automat in "Idei de cadouri zilnic" (~06:00).
# Workflow-ul asta e doar pentru postare manuala (buton "Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posteaza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deseneaza imaginea postarii (stilul paginii)
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python imagine_postare.py

      - name: Posteaza postarea zilei
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python post_facebook.py

      - name: Noteaza ca am postat
        run: |
          git config user.name "cadouri-bot"
          git config user.email "cadouri-bot@users.noreply.github.com"
          git add idei/postat.txt 2>/dev/null || true
          git commit -m "Postat pe Facebook $(date +%F)" || echo "Nimic nou"
          git push
